User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100

# Notice carries the refusals, which are the only evidence an allowlist entry is argued from.
LogLevel Info
# A bind-mounted host directory: the log survives the daemon.
LogFile "/var/log/tinyproxy/tinyproxy.log"

ConnectPort 443

Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterType ere
FilterCaseSensitive No
