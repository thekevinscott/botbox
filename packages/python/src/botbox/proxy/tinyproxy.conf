User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
MaxClients 100

# Notice carries the refusals, which are the only evidence an allowlist entry is argued from.
LogLevel Info

ConnectPort 443

Filter "/etc/tinyproxy/filter"
# ConnectPort binds CONNECT only. Matching the whole URL is the one check on a plain-HTTP port.
FilterURLs Yes
FilterDefaultDeny Yes
FilterType ere
FilterCaseSensitive No

# Clients arrive through the socket relay, from loopback.
Allow 127.0.0.1
