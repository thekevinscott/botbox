[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "botbox"
dynamic = ["version"]
description = "Run a coding agent inside a locked-down Docker container."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Kevin Scott", email = "me@thekevinscott.com" }]
dependencies = [
    "json5>=0.17.3",
]

[project.urls]
Repository = "https://github.com/thekevinscott/botbox"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-describe>=2",
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/botbox"]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", "**/*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "C90", "UP", "ARG", "SIM", "PTH", "PLR", "RUF", "SLF"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["PLR2004", "PLR0915", "C901"]
"tests/**/*.py" = ["PLR2004", "PLR0915", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["botbox"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["src"]
asyncio_mode = "auto"
