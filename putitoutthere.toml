[putitoutthere]
version = 1

# Use extglobs: leading ! patterns do not subtract matches.

[[package]]
name = "botbox"
kind = "pypi"
pypi = "botbox"
path = "packages/python"
first_version = "0.0.1"
build = "hatch"
globs = [
  "packages/python/!(testing-conventions.toml)",
  "packages/python/!(changelog.d|migrations.d|e2e-attestations)/**",
  "LICENSE",
]
