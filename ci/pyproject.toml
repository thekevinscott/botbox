# Repo-internal CI gate CLI. A real package — built and tested to the same
# standards as shipped code — but NEVER published (see the Private classifier).
# Workflows invoke it as one-line `run:` steps: `uv run --project ci ci <gate>`.
[project]
name = "template-lib-ci"
version = "0.0.0"
description = "Repo-internal CLI backing this repo's CI gates; never published."
requires-python = ">=3.12"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
ci = "ci.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci"]

[tool.pytest.ini_options]
# Colocated tests next to the modules they cover (foo.py <-> foo_test.py),
# the same testing-conventions standard the packages follow. Pytest's default
# discovery only matches test_*.py, so opt the *_test.py form in here.
python_files = ["*_test.py", "test_*.py"]
testpaths = ["src"]
