name: E2E

# A change only to e2e tests or receipts runs these, not the full Python suite.

on:
  pull_request:
    paths:
      - 'packages/python/tests/e2e/**'
      - 'packages/python/e2e-attestations/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@just
      - run: just typecheck

  conventions:
    name: Python
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      source: packages/python
      run_e2e: true
      gates: '["e2e-verify"]'
