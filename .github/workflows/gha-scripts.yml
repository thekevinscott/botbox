name: CI package

# Test the repo-internal `ci` package (ci/, colocated tests) that backs the
# changelog gate. The "no logic in workflow YAML" rule itself is enforced by
# testing-conventions' workflow-lint check (workflow-lint.yml). See
# docs/internals/repo.md.

on:
  pull_request:
    paths:
      - 'ci/**'
      - '.github/workflows/gha-scripts.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Test the ci package
        run: uv run pytest
        working-directory: ci
