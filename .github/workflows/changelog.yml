name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'packages/**'
      - 'docs/changelog.d/**'
      - 'docs/migrations.d/**'
      - '.github/workflows/changelog.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    name: Changelog fragment added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --project ci ci check-changelog
