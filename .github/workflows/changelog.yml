name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'packages/**'
      - 'docs/changelog.d/**'
      - 'docs/migrations.d/**'
      - '.github/workflows/changelog.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    name: Changelog fragment added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -ciE '^skip-changelog:' >/dev/null && exit 0
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          bad=$(echo "$changed" | grep -E '^docs/(changelog|migrations)\.d/[^/]+$' | grep -vE '/(README\.md|[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.md)$' || true)
          code=$(echo "$changed" | grep -E '^packages/python/' | grep -vE '^packages/python/((CHANGELOG|MIGRATIONS)\.md$|.*\.(test|spec)\.(ts|tsx|js|py|rs)$|(tests?|__tests__)/)' || true)
          frag=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" | grep -E '^docs/(changelog|migrations)\.d/[0-9]{4}-[0-9]{2}-[0-9]{2}-python-[a-z0-9-]+\.md$' || true)
          if [ -n "$bad" ] || { [ -n "$code" ] && [ -z "$frag" ]; }; then echo "::error::bad fragment name ($bad) or packages/python code without a docs/changelog.d/YYYY-MM-DD-python-<slug>.md fragment; or add a 'skip-changelog:' trailer"; exit 1; fi
